version: '3.5'

services:
  omada-controller:
    build:
      context: .  # Builds the image from the Dockerfile in the current directory
    container_name: omada-controller
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    ports:
      - "8088:8088"
      - "8043:8043"
      - "8843:8843"
      - "29810:29810/udp"
      - "29811:29811"
      - "29812:29812"
      - "29813:29813"
      - "29814:29814"
      - "29815:29815"
      - "29816:29816"
    cap_add:
      - ALL
    volumes:
      - omada-data:/opt/tplink/EAPController/data  # Persist Omada data
      - omada-logs:/opt/tplink/EAPController/logs # Persist logs
    environment:
      - INSTALL_DIR=/opt/tplink/EAPController
    restart: unless-stopped
    networks:
      - omada-net

  # Mobile-first React dashboard (web/). Serves the built SPA and
  # reverse-proxies /controller-api/* to the controller above.
  web-ui:
    build:
      context: ./web
    container_name: omada-web-ui
    ports:
      - "8080:80"    # redirects to HTTPS
      - "8443:443"
    environment:
      - WEB_UI_HTTPS_PORT=8443
    volumes:
      - web-ui-certs:/etc/nginx/certs   # HTTPS certificate, kept across updates
    depends_on:
      - omada-controller
      - terminal
    restart: unless-stopped
    networks:
      - omada-net

  # Device terminal gateway (web/terminal/): WebSocket ⇄ SSH for the
  # dashboard's Terminal tab. Not published — only web-ui talks to it.
  terminal:
    build:
      context: ./web/terminal
    container_name: omada-terminal
    environment:
      - OMADA_CONTROLLER=https://omada-controller:8043
    depends_on:
      - omada-controller
    restart: unless-stopped
    networks:
      - omada-net

# Volumes to persist data between container restarts
volumes:
  omada-data:
  omada-logs:
  web-ui-certs:

networks:
  omada-net: